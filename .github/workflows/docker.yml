name: build-opencode-image

on:
  schedule:
    - cron: "0 18 * * *"   # 每天北京时间 02:00 检查上游新版本
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "指定版本（留空 = 自动按版本号取上游最新稳定版）"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest   # amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version & image name
        run: |
          VERSION="${{ inputs.opencode_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
              'https://api.github.com/repos/anomalyco/opencode/releases?per_page=100' \
              | jq -r '
                  [.[] | select(.draft == false and .prerelease == false) | .tag_name
                   | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                  | sort_by(ltrimstr("v") | split(".") | map(tonumber))
                  | last // error("no stable release found")
                  | ltrimstr("v")')"
          fi
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencode-debian" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 每次都强制重建并覆盖 tag（版本号 + latest）
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false   # 不生成 attestation manifest，保证阿里云 ACR 可同步
          sbom: false
          build-args: OPENCODE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
